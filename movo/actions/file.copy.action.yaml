id: file.copy
name: Dosyayı kopyala
summary: Dosyayı hedef klasöre kopyalar, aslını bırakır.
category: dosya
permissions: [fs.read, fs.write]
inputs:
  file: {type: file, label: Dosya, required: true}
  to_dir: {type: directory, label: Hedef klasör, required: true}
  pattern: {type: text, label: Ad deseni, default: "{name}.{ext}"}
  overwrite: {type: bool, label: Üzerine yaz, default: false}
outputs:
  file: {type: file, label: Kopya}
  directory: {type: directory, label: Klasör}
impl:
  kind: python
  entry: movo.actions.builtin:file_copy
