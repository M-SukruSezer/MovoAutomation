id: file.glob
name: Klasördeki dosyalar
summary: Bir klasörü desene uyan dosya listesine çevirir; döngülerin kaynağı.
category: dosya
permissions: [fs.read]
tags: [liste, döngü, dosya]
inputs:
  dir: {type: directory, label: Klasör, required: true}
  pattern: {type: text, label: Desen, default: "*"}
  recursive: {type: bool, label: Alt klasörlere de bak, default: false}
  sort: {type: text, label: Sıralama, default: name, choices: [name, time, size]}
  newest_first: {type: bool, label: Tersten sırala, default: false}
  produces:
    type: text
    label: Klasördeki içerik
    default: file
    choices: [file, image, audio, video]
outputs:
  files: {type: list<file>, label: Dosyalar, narrowed_by: produces}
  count: {type: number, label: Adet}
impl:
  kind: python
  entry: movo.actions.builtin:file_glob
